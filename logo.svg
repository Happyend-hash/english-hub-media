<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <radialGradient id="bg" cx="0.22" cy="0.18" r="1.05">
      <stop offset="0" stop-color="#3B31C9"/>
      <stop offset="0.45" stop-color="#2620A6"/>
      <stop offset="0.8" stop-color="#1A1577"/>
      <stop offset="1" stop-color="#120F55"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.82" cy="0.06" r="0.42">
      <stop offset="0" stop-color="#8C78D8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8C78D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#4B3FD6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4B3FD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="140" x2="0" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66E"/>
      <stop offset="1" stop-color="#EBA635"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="400" x2="0" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66E"/>
      <stop offset="1" stop-color="#EFAE3F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B0838" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <rect width="640" height="640" fill="url(#glow2)"/>
  <circle cx="320" cy="320" r="292" fill="none" stroke="#F8C552" stroke-opacity="0.38" stroke-width="2"/>

  <g filter="url(#soft)">
    <!-- house: one continuous gold path, rounded joins, no overlaps -->
    <path d="M206 247 L320 152 L434 247 M233 224.5 L233 362 Q233 372 243 372 L397 372 Q407 372 407 362 L407 224.5"
          fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- microphone -->
    <rect x="296" y="226" width="48" height="76" rx="24" fill="#FFFFFF"/>
    <path d="M308.5 266 L318 276 L333 254" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M276 276 A44 44 0 0 0 364 276" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M320 320 L320 346" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <path d="M300 348 L340 348" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="320" y="455" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="66" letter-spacing="-0.5" filter="url(#soft)"><tspan fill="#FFFFFF">English </tspan><tspan fill="url(#goldText)">Hub</tspan></text>
  <text x="323" y="500" text-anchor="middle" font-family="Poppins" font-weight="600" font-size="19" letter-spacing="7.5" fill="#F8C552">FAMILY</text>
</svg>
